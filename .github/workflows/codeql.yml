name: codeql

# Code scanning for this fork, including code merged in from upstream.
# Upstream merges are pushed by railway.yml with GITHUB_TOKEN, which does not
# trigger push events, so railway.yml dispatches this workflow after a merge.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rust is analysed from source (build-mode none); actions covers the workflows.
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
