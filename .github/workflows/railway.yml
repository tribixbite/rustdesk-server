name: railway

# Keeps this fork current with rustdesk/rustdesk-server and deploys it to
# Railway (docs/railway.md):
#   - daily: merge upstream master into this fork, then test and deploy if it moved
#   - push to master / manual run: test and deploy the current tree
#   - push to any other branch: test only
#
# Requires the RAILWAY_TOKEN repository secret: a Railway *project* token for
# the project and environment that hold the hbbs and hbbr services.

on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: ["**"]
    # Changes that cannot affect the build or the running servers.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/workflows/codeql.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write
  # to dispatch codeql.yml after an upstream merge
  actions: write

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sync-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream master
        id: sync
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # merge_type is "none" when the fork already contains upstream.
          merge_type=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=master --jq .merge_type)
          echo "merge_type=${merge_type}" | tee -a "$GITHUB_OUTPUT"

      - name: Scan merged upstream code
        if: github.event_name == 'schedule' && steps.sync.outputs.merge_type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with GITHUB_TOKEN does not trigger push workflows, so
        # code scanning is started explicitly for the merged head.
        run: gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref master

      - name: Decide what to run
        id: gate
        run: |
          test=true
          deploy=false
          case "${{ github.event_name }}" in
            schedule)
              if [ "${{ steps.sync.outputs.merge_type }}" = "none" ]; then
                test=false
                echo "Upstream unchanged; nothing to deploy."
              else
                deploy=true
              fi ;;
            workflow_dispatch) deploy=true ;;
            push)
              if [ "${{ github.ref }}" = "refs/heads/master" ]; then deploy=true; fi ;;
          esac
          echo "test=${test}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.test == 'true'
        with:
          # After a scheduled merge, use the merged branch head rather than the
          # commit the schedule fired on.
          ref: ${{ github.event_name == 'schedule' && 'master' || github.sha }}
          submodules: recursive

      - name: Test
        if: steps.gate.outputs.test == 'true'
        run: cargo test --locked

      - name: Deploy hbbs and hbbr
        if: steps.gate.outputs.deploy == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "RAILWAY_TOKEN secret is not set" >&2; exit 1; }
          # Pinned CLI version; bump deliberately.
          npm install -g @railway/cli@4.66.0
          railway up --ci --service hbbs
          railway up --ci --service hbbr
