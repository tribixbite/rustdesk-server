name: railway

# Keeps this fork current with rustdesk/rustdesk-server and deploys it to
# Railway (docs/railway.md):
#   - daily: merge upstream master into this fork, then test and deploy if it moved
#   - push to master / manual run: test and deploy the current tree
#   - push to any other branch: test only
# hbbs/hbbr are tested and deployed when files outside api/ change; the api
# service (api/, docs/api.md) when files under api/ change.
#
# Requires the RAILWAY_TOKEN repository secret: a Railway *project* token for
# the project and environment that hold the hbbs, hbbr and api services.

on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: ["**"]
    # Changes that cannot affect the build or the running servers.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # Android client patch tooling; not part of any service image.
      - "client-patch/**"
      - ".github/dependabot.yml"
      - ".github/workflows/codeql.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: write
  # to dispatch codeql.yml after an upstream merge
  actions: write

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sync-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream master
        id: sync
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # merge_type is "none" when the fork already contains upstream.
          merge_type=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=master --jq .merge_type)
          echo "merge_type=${merge_type}" | tee -a "$GITHUB_OUTPUT"

      - name: Scan merged upstream code
        if: github.event_name == 'schedule' && steps.sync.outputs.merge_type != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with GITHUB_TOKEN does not trigger push workflows, so
        # code scanning is started explicitly for the merged head.
        run: gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref master

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.sync.outputs.merge_type != 'none'
        with:
          # After a scheduled merge, use the merged branch head rather than the
          # commit the schedule fired on.
          ref: ${{ github.event_name == 'schedule' && 'master' || github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Decide what to run
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # rust: hbbs/hbbr (everything outside api/); api: the api/ service.
          rust=false; api=false; deploy=false
          case "${{ github.event_name }}" in
            schedule)
              # Upstream merges never touch api/.
              if [ "${{ steps.sync.outputs.merge_type }}" != "none" ]; then rust=true; deploy=true; fi ;;
            workflow_dispatch) rust=true; api=true; deploy=true ;;
            push)
              if [ "${{ github.ref }}" = "refs/heads/master" ]; then deploy=true; fi
              if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                # New branch or rewritten history: no reliable base, run everything.
                rust=true; api=true
              else
                changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
                if printf '%s\n' "$changed" | awk '!/^api\// && !/^client-patch\// && NF {f=1} END {exit !f}'; then rust=true; fi
                if printf '%s\n' "$changed" | awk '/^api\// {f=1} END {exit !f}'; then api=true; fi
              fi ;;
          esac
          echo "rust=${rust} api=${api} deploy=${deploy}"
          { echo "rust=${rust}"; echo "api=${api}"; echo "deploy=${deploy}"; } >> "$GITHUB_OUTPUT"

      - name: Test hbbs/hbbr
        if: steps.gate.outputs.rust == 'true'
        run: cargo test --locked

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.api == 'true'
        with:
          bun-version: 1.3.10

      - name: Test api
        if: steps.gate.outputs.api == 'true'
        working-directory: api
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
          bun run build:web

      - name: Install Railway CLI
        if: steps.gate.outputs.deploy == 'true' && (steps.gate.outputs.rust == 'true' || steps.gate.outputs.api == 'true')
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "RAILWAY_TOKEN secret is not set" >&2; exit 1; }
          # Pinned CLI version; bump deliberately.
          npm install -g @railway/cli@4.66.0

      - name: Deploy hbbs and hbbr
        if: steps.gate.outputs.deploy == 'true' && steps.gate.outputs.rust == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci --service hbbs
          railway up --ci --service hbbr

      - name: Deploy api
        if: steps.gate.outputs.deploy == 'true' && steps.gate.outputs.api == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service api
